# 网关转发示例（Nginx 语法，其他网关按相同含义配置）
# 客户端：ANTHROPIC_BASE_URL=https://<网关域名>/llm
# 来源头清理和鉴权由公网 Caddy 负责，网关只做转发

location /llm/ {
    proxy_pass https://<RELAY_HOST>/llm/;
    proxy_set_header Host <RELAY_HOST>;

    # 校验公网机器的正式证书（系统证书库路径：Debian/Ubuntu 如下，RHEL 系为 /etc/pki/tls/certs/ca-bundle.crt）
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_name <RELAY_HOST>;

    # 流式输出与长请求
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;
}
